openapi: 3.0.3
info:
  title: black.tax core API
  version: 1.0.0
  description: |
    System of record for stokvels, members, contributions, debts, loans, ledger mirror and agent decisions.
    API-first: this file is the contract. The Spring Boot (JHipster) service generates `*Api` / `*ApiDelegate`
    interfaces from it, and the web app and agent service generate their TypeScript clients from it.

    Conventions
    - Money is a decimal string in rand (`"30000.00"`); the UI formats it.
    - Every path under `/stokvels/{stokvelId}` is tenant-scoped. The caller must be a member of that stokvel
      (or the agent service, with a service token). Data from other stokvels is never returned.
    - Times are ISO-8601 with offset (SAST, `+02:00`).
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: stokvels
  - name: members
  - name: ledger
  - name: agent
  - name: lending
  - name: notifications
  - name: webhooks
  - name: internal
    description: Called by the agent service with a service token, never by the browser.
  - name: dev
    description: Only enabled with the `dev` Spring profile.

paths:
  # ------------------------------------------------------------------ auth
  /auth/otp:
    post:
      tags:
        - auth
      operationId: requestOtp
      security: []
      summary: Send a 6-digit sign-in code by SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '204':
          description: Code sent
        '400':
          $ref: '#/components/responses/Problem'
  /auth/otp/verify:
    post:
      tags:
        - auth
      operationId: verifyOtp
      security: []
      summary: Exchange a code for a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerification'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags:
        - auth
      operationId: getCurrentUser
      responses:
        '200':
          description: The signed-in user and the stokvels they belong to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'

  # ------------------------------------------------------------------ stokvels
  /stokvels:
    get:
      tags:
        - stokvels
      operationId: listStokvels
      summary: Stokvels the caller belongs to or is invited to (switcher)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StokvelListItem'
    post:
      tags:
        - stokvels
      operationId: createStokvel
      summary: Onboarding. The caller becomes the treasurer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStokvelRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stokvel'
  /stokvels/{stokvelId}:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - stokvels
      operationId: getStokvel
      responses:
        '200':
          description: The stokvel and its constitution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stokvel'
        '404':
          $ref: '#/components/responses/Problem'
  /stokvels/{stokvelId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - stokvels
      operationId: getDashboard
      summary: Figures for Home. Every figure reconciles with the ledger and member
        debts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /stokvels/{stokvelId}/constitution:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    patch:
      tags:
        - stokvels
      operationId: updateConstitution
      summary: Treasurer only. Each changed field appends a CONSTITUTION_CHANGE ledger
        entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstitutionUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stokvel'
        '403':
          $ref: '#/components/responses/Problem'
  /stokvels/{stokvelId}/queue-votes:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    post:
      tags:
        - stokvels
      operationId: requestQueueVote
      responses:
        '202':
          description: Vote sent to members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
  /stokvels/{stokvelId}/dissolution-proposals:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    post:
      tags:
        - stokvels
      operationId: proposeDissolution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmName
              properties:
                confirmName:
                  type: string
                  description: Must equal the stokvel name exactly
      responses:
        '202':
          description: Proposal sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
        '422':
          $ref: '#/components/responses/Problem'

  # ------------------------------------------------------------------ members
  /stokvels/{stokvelId}/members:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - members
      operationId: listMembers
      summary: Roster in queue order (debt-payoff) or join order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
  /stokvels/{stokvelId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
      - $ref: '#/components/parameters/MemberId'
    get:
      tags:
        - members
      operationId: getMember
      responses:
        '200':
          description: Member with the last six contribution periods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
    patch:
      tags:
        - members
      operationId: updateMemberContribution
      summary: Sets the mandate to PENDING and asks the member to re-approve with
        their bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contributionAmount
              properties:
                contributionAmount:
                  $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
    delete:
      tags:
        - members
      operationId: removeMember
      responses:
        '200':
          description: Removed. Returns what they owe or are owed under rule 4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberRemoval'
  /stokvels/{stokvelId}/members/{memberId}/pause:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
      - $ref: '#/components/parameters/MemberId'
    post:
      tags:
        - members
      operationId: pauseMandate
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
  /stokvels/{stokvelId}/members/{memberId}/resume:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
      - $ref: '#/components/parameters/MemberId'
    post:
      tags:
        - members
      operationId: resumeMandate
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
  /stokvels/{stokvelId}/invitations:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    post:
      tags:
        - members
      operationId: inviteMember
      summary: Creates a PENDING member and sends the Stitch DebiCheck mandate link by
        SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '502':
          $ref: '#/components/responses/Problem'

  # ------------------------------------------------------------------ ledger
  /stokvels/{stokvelId}/ledger:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - ledger
      operationId: listLedgerEntries
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/LedgerEntryType'
      responses:
        '200':
          description: Entries oldest first, with the pool balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
  /stokvels/{stokvelId}/ledger/export.csv:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - ledger
      operationId: exportLedger
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
  /stokvels/{stokvelId}/ledger/{entryId}:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
      - name: entryId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - ledger
      operationId: getLedgerEntry
      responses:
        '200':
          description: Entry with its Beancount text and file hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
        '404':
          $ref: '#/components/responses/Problem'

  # ------------------------------------------------------------------ agent
  /stokvels/{stokvelId}/decisions:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - agent
      operationId: listDecisions
      parameters:
        - name: filter
          in: query
          schema:
            $ref: '#/components/schemas/DecisionFilter'
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentDecision'
  /stokvels/{stokvelId}/agent/evaluations:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    post:
      tags:
        - agent
      operationId: runAgent
      summary: Treasurer asks the agent to evaluate now (MANUAL trigger)
      responses:
        '200':
          description: The agent's evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEvaluation'
  /stokvels/{stokvelId}/agent/resume:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    post:
      tags:
        - agent
      operationId: resumeAgent
      summary: Treasurer override of a pause. Logged as a decision and a ledger entry.
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDecision'

  # ------------------------------------------------------------------ lending
  /stokvels/{stokvelId}/lendable:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - lending
      operationId: getLendable
      responses:
        '200':
          description: Pool − reserve − obligations − loans funded today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lendable'
  /stokvels/{stokvelId}/loan-requests:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - lending
      operationId: listLoanRequests
      responses:
        '200':
          description: Open requests, each assessed by the agent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanRequest'
    post:
      tags:
        - lending
      operationId: createLoanRequest
      summary: Another stokvel's agent asks to borrow. The lender's agent assesses it
        on arrival.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLoanRequest'
      responses:
        '201':
          description: Created and assessed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanRequest'
  /stokvels/{stokvelId}/loan-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags:
        - lending
      operationId: getLoanRequest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanRequest'
  /stokvels/{stokvelId}/loan-requests/{requestId}/approval:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags:
        - lending
      operationId: approveLoanRequest
      summary: Treasurer approves. The agent creates the ERC-8183 job on Arc and funds
        the escrow.
      responses:
        '200':
          description: Escrow funded or submitted (testnet finality is not awaited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApproval'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /stokvels/{stokvelId}/loan-requests/{requestId}/decline:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags:
        - lending
      operationId: declineLoanRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanDecline'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanRequest'
  /stokvels/{stokvelId}/loans:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - lending
      operationId: listLoans
      parameters:
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/LoanDirection'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Loan'

  # ------------------------------------------------------------------ notifications
  /stokvels/{stokvelId}/notifications:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - notifications
      operationId: listNotifications
      responses:
        '200':
          description: Latest agent events, also sent on WhatsApp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /stokvels/{stokvelId}/notifications/read:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    post:
      tags:
        - notifications
      operationId: markNotificationsRead
      responses:
        '204':
          description: Marked read

  # ------------------------------------------------------------------ webhooks
  /webhooks/stitch:
    post:
      tags:
        - webhooks
      operationId: receiveStitchWebhook
      security: []
      summary: Signed Stitch events (mandate and collection results)
      parameters:
        - name: X-Stitch-Signature
          in: header
          required: true
          description: '`t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`,
            verified in constant time'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StitchEvent'
      responses:
        '204':
          description: Processed
        '401':
          $ref: '#/components/responses/Problem'

  # ------------------------------------------------------------------ internal (agent service)
  /internal/stokvels/{stokvelId}/state:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    get:
      tags:
        - internal
      operationId: getAgentState
      security:
        - serviceToken: []
      summary: Everything the agent needs to evaluate, in one read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentState'
  /internal/stokvels/{stokvelId}/decisions:
    parameters:
      - $ref: '#/components/parameters/StokvelId'
    post:
      tags:
        - internal
      operationId: recordDecision
      security:
        - serviceToken: []
      summary: The agent writes a decision back. Core mirrors the ledger entry and
        applies its effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDecisionRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDecision'

  # ------------------------------------------------------------------ dev
  /dev/stitch/events:
    post:
      tags:
        - dev
      operationId: simulateStitchEvent
      summary: Sign a Stitch event with the webhook secret and deliver it, as the
        sandbox would
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatedStitchEvent'
      responses:
        '202':
          description: Delivered
  /dev/sessions:
    post:
      tags:
        - dev
      operationId: devSession
      security: []
      summary: Demo login as a seeded user (treasurer or member) without an SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: '0825550147'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  parameters:
    StokvelId:
      name: stokvelId
      in: path
      required: true
      schema:
        type: string
        example: masakhane
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        example: thabo
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        example: REQ-31
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: string
      pattern: ^-?\d+(\.\d{1,2})?$
      example: '30000.00'
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Role:
      type: string
      enum:
        - TREASURER
        - MEMBER
        - ADMIN
    StokvelType:
      type: string
      enum:
        - GROCERY
        - ROTATIONAL
        - BURIAL
        - INVESTMENT
        - DEBT_PAYOFF
    Frequency:
      type: string
      enum:
        - WEEKLY
        - FORTNIGHTLY
        - MONTHLY
    MandateStatus:
      type: string
      enum:
        - PENDING
        - ACTIVE
        - FAILED
        - PAUSED
    QueueStatus:
      type: string
      enum:
        - CLEARED
        - CURRENT
        - WAITING
    ContributionStatus:
      type: string
      enum:
        - PENDING
        - COLLECTED
        - FAILED
        - RETRIED
        - DUE
        - UPCOMING
    LedgerEntryType:
      type: string
      enum:
        - CONTRIBUTION
        - DEBT_PAYMENT
        - DEBT_CLEARED
        - RECYCLED
        - COLLECTION_FAILED
        - LOAN_OUT
        - LOAN_REPAID
        - LOAN_DECLINED
        - CONSTITUTION_CHANGE
    DecisionType:
      type: string
      enum:
        - PAYMENT
        - CLEARED
        - RECYCLE
        - PAUSE
        - RESUME
        - HOLD
        - LEND
        - DECLINE
        - ASSESS
    DecisionFilter:
      type: string
      enum:
        - Lending
        - Contributions
        - Pauses
        - Cleared
    AgentOutcome:
      type: string
      enum:
        - EXECUTE
        - PAUSE
        - PROPOSE
        - NO_ACTION
    Trigger:
      type: string
      enum:
        - SCHEDULED_TICK
        - CONTRIBUTION_WEBHOOK
        - MANUAL
    Tier:
      type: string
      enum:
        - A
        - B
        - C
    LoanStatus:
      type: string
      enum:
        - ON_TRACK
        - DUE_SOON
        - OVERDUE
        - REPAID
    LoanDirection:
      type: string
      enum:
        - OUT
        - IN
    EscrowStatus:
      type: string
      enum:
        - OPEN
        - FUNDED
        - SUBMITTED
        - COMPLETED
        - REJECTED
        - EXPIRED

    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          description: 10 digits starting with 0
          example: '0825550147'
        intent:
          type: string
          enum:
            - SIGN_UP
            - SIGN_IN
          default: SIGN_IN
        popiaConsent:
          type: boolean
          description: Required for SIGN_UP
        name:
          type: string
    OtpVerification:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: ^\d{6}$
    Session:
      type: object
      required:
        - idToken
        - user
      properties:
        idToken:
          type: string
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required:
        - id
        - name
        - phone
        - memberships
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
        phone:
          type: string
        town:
          type: string
        memberships:
          type: array
          items:
            type: object
            required:
              - stokvelId
              - role
            properties:
              stokvelId:
                type: string
              memberId:
                type: string
              role:
                $ref: '#/components/schemas/Role'

    Recycling:
      type: object
      properties:
        enabled:
          type: boolean
        percentage:
          type: integer
          enum:
            - 50
            - 75
            - 100
        graceMonths:
          type: integer
          minimum: 0
          maximum: 3
    Stokvel:
      type: object
      required:
        - id
        - name
        - type
        - contributionAmount
        - frequency
        - reserveFloor
        - memberCount
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/StokvelType'
        contributionAmount:
          $ref: '#/components/schemas/Money'
        frequency:
          $ref: '#/components/schemas/Frequency'
        collectionDay:
          type: integer
        reserveFloor:
          $ref: '#/components/schemas/Money'
        recycling:
          $ref: '#/components/schemas/Recycling'
        queueOrder:
          type: string
          enum:
            - HIGHEST_RATE_FIRST
            - DRAWN_LOTS
        lendingEnabled:
          type: boolean
        lendingCutoffDays:
